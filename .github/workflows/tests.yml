name: Tests and reference evals

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: docker compose up -d --wait postgres
      - run: uv run queryforge init-db
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest tests/unit
      - name: Postgres integration tests
        run: uv run pytest tests/integration
      - name: Evaluation harness tests
        run: >-
          uv run pytest
          tests/eval_harness/test_case_contracts.py
          tests/eval_harness/test_grading.py
          tests/eval_harness/test_runner.py
          tests/eval_harness/test_reporting_cli.py
      - name: Reference-suite integration tests
        run: uv run pytest tests/eval_harness/test_reference_suite_with_postgres.py
        env:
          QUERYFORGE_TEST_EVAL_DB: "1"
      - name: Development reference evaluation
        run: uv run queryforge evals run --mode reference --evaluation-set development
      - name: Retain reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-evaluation-reports
          path: evaluation-results/
          if-no-files-found: ignore
      - name: Stop database
        if: always()
        run: docker compose down
