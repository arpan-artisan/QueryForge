[project]
name = "queryforge"
version = "0.1.0"
description = "Smallest working NL2SQL loop for QueryForge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.7",
    "psycopg[binary]>=3.2.13",
    "sqlglot>=27.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.8",
]

[project.scripts]
queryforge = "queryforge.cli:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
